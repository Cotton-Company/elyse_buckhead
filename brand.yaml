# =============================================================================
# brand.yaml — Ground truth for Elyse Buckhead
# Source: CB_ELYSE_BUCKHEAD_Final.docx (AI-Integrated Creative Brief)
#
# This file is the single source of truth the report scores answer engines
# against. If the brief changes, change this file — nothing else.
# =============================================================================

brand:
  name: "Elyse Buckhead"
  # Strings that count as a brand mention in an AI answer.
  aliases:
    - "Elyse Buckhead"
    - "Elyse at Buckhead"
    - "Elyse Residences"
    - "102 West Paces"
    - "102 W Paces Ferry"
  legal_entity: "KT 102 West Paces LLC"
  domain: "elysebuckhead.com"

# Domains that count as "owned / controlled" citations. A citation here is the
# strongest possible outcome — the engine is quoting your own material.
owned_domains:
  - "elysebuckhead.com"
  - "elysepresentation.com"
  - "kolterurban.com"

# Domains that count as "earned / partner" citations — credible third parties
# carrying your narrative. Second-best outcome.
partner_domains:
  - "atlantafinehomes.com"
  - "sothebysrealty.com"
  - "rjtr.com"
  - "ciddesigngroup.com"

# Competitors and adjacent projects. Tracked for share-of-voice.
competitors:
  - name: "Veridian Buckhead"
    note: "Primary forthcoming competitor, anticipated 2026 delivery"
  - name: "The Dillon"
    note: "Kolter Urban's prior Buckhead tower — resale competition"
  - name: "Graydon Buckhead"
    note: "Kolter Urban's prior Buckhead tower — resale competition"
  - name: "The Charles"
  - name: "Atlanta Fine Homes"
    treat_as_competitor: false

# -----------------------------------------------------------------------------
# CHECKABLE FACTS
# Each fact has an `id`, the correct `value`, and `accept` patterns (regex,
# case-insensitive) that count as a correct statement in an AI answer.
# `contradicts` patterns count as a HALLUCINATION — a wrong fact stated with
# confidence. Hallucinations are scored far more harshly than omissions.
# -----------------------------------------------------------------------------
facts:
  - id: residence_count
    label: "Number of residences"
    value: "194"
    accept: ['\b194\b']
    contradicts: ['\b(1[0-8][0-9]|19[0-3]|19[5-9]|2[0-9]{2})\s*(residences|homes|units|condominiums)']

  - id: stories
    label: "Building height"
    value: "20 stories"
    accept: ['\b20[- ]stor(y|ey|ies)\b', '\btwenty[- ]stor']
    contradicts: ['\b(1[0-9]|2[1-9]|[3-9][0-9])[- ]stor(y|ey|ies)\b']

  - id: price_from
    label: "Starting price"
    value: "$1,099,000 (marketed as 'from $1 million')"
    accept: ['\$1[,.]?099[,.]?000', '\$1\.09', 'from \$1 ?(million|m\b)', '\$1,000,000']
    contradicts: ['(from|starting at|priced from)\s*\$([2-9]|1[0-9])(\.[0-9])?\s*(million|m\b)']

  - id: price_to
    label: "Top-end price"
    value: "$6,799,000"
    accept: ['\$6[,.]?799[,.]?000', '\$6\.8 ?million', '\$6\.79']
    contradicts: []

  - id: sqft_range
    label: "Square footage range"
    value: "1,436 to 4,032 sq ft"
    accept: ['1[,.]?436', '4[,.]?032']
    contradicts: []

  - id: architect
    label: "Architect"
    value: "Rule Joy Trammell + Rubio (RJTR)"
    accept: ['rule joy trammell', '\bRJTR\b']
    contradicts: ['(designed|architect(ed)? by)\s+(?!rule joy)(rottet|arquitectonica|goettsch|smallwood|hks|kpf|gensler)']

  - id: interior_designer
    label: "Amenity interior designer"
    value: "CID Design Group"
    accept: ['cid design']
    contradicts: []

  - id: general_contractor
    label: "General contractor"
    value: "Integra Construction"
    accept: ['integra construction', '\bintegra\b']
    contradicts: []

  - id: development_manager
    label: "Development manager"
    value: "Kolter Urban"
    accept: ['kolter urban', '\bkolter\b']
    contradicts: ['(developed|being developed) by\s+(?!kolter)(related|extell|terwilliger|selene|greystar)']

  - id: broker
    label: "Sales representation"
    value: "Atlanta Fine Homes Sotheby's International Realty"
    accept: ["atlanta fine homes", "sotheby.s international realty"]
    contradicts: ['(listed|represented) (by|with)\s+(compass|douglas elliman|coldwell|keller williams|corcoran)']

  - id: amenity_sf
    label: "Amenity square footage"
    value: "63,000 sq ft"
    accept: ['63[,.]?000']
    contradicts: ['\b([1-5][0-9]|[6][1-2]|6[4-9]|[7-9][0-9])[,.]?000\s*(square feet|sq\.? ?ft\.?)\s*of amenit']

  - id: address
    label: "Project address"
    value: "102 W Paces Ferry Road NW, Atlanta, GA 30305"
    accept: ['102 w(est)?\.? paces ferry']
    contradicts: ['\b(?!102)\d{2,4} w(est)?\.? paces ferry road nw']

  - id: delivery
    label: "Delivery timing"
    value: "Q4 2028"
    accept: ['q4 2028', '(late|fourth quarter) 2028', '\b2028\b']
    contradicts: ['(deliver|completion|complete|occupancy)[^.]{0,40}\b(202[4-7]|202 9|203[0-9])\b']

  - id: groundbreaking
    label: "Groundbreaking"
    value: "Q2 2026"
    accept: ['q2 2026', '(second quarter|spring) (of )?2026']
    contradicts: []

  - id: st_regis
    label: "St. Regis adjacency"
    value: "Directly adjacent to the St. Regis Atlanta"
    accept: ['st\.? regis']
    contradicts: []

  - id: sales_phone
    label: "Sales gallery phone"
    value: "404.777.6259"
    accept: ['404[.\-\s]?777[.\-\s]?6259']
    contradicts: []

# -----------------------------------------------------------------------------
# TONE COMPLIANCE
# The brief is explicit about vocabulary. When an engine describes the property
# in its own words, we check whether the language it reaches for matches the
# brand voice — that tells you whether your published copy is training the
# engines correctly.
# -----------------------------------------------------------------------------
tone:
  preferred:
    ["timeless", "refined", "thoughtfully designed", "quietly elevated",
     "composed", "effortless", "walkable", "enduring", "livable"]
  discouraged:
    ["developer", "exclusive", "opulent", "lavish", "unrivaled", "prestigious",
     "iconic", "world-class", "ultra-luxury", "must-see", "act now"]
  # "Luxury" is permitted when factual/contextual but flagged when it carries
  # the value claim. Counted separately, never a hard penalty.
  monitored: ["luxury", "luxurious"]

# -----------------------------------------------------------------------------
# SCORING WEIGHTS — visibility score is 0-100 per query.
# -----------------------------------------------------------------------------
scoring:
  weights:
    mentioned: 35          # brand named anywhere in the answer
    owned_citation: 20     # an owned domain appears in the engine's sources
    partner_citation: 10   # a partner domain appears in the sources
    prominence: 15         # brand appears in the first third of the answer
    accuracy: 20           # share of checkable facts stated correctly
  hallucination_penalty: 12   # per contradicted fact, subtracted from total
