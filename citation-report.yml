name: Citation Report

on:
  schedule:
    # 07:00 America/New_York — 11:00 UTC (EST) / 12:00 UTC (EDT).
    # GitHub cron is UTC only and does not observe DST.
    - cron: "0 12 * * 1"
  workflow_dispatch:
    inputs:
      send_email:
        description: "Email the report when the run finishes"
        type: boolean
        default: true
      stage:
        description: "Limit to one funnel stage (blank = all)"
        type: choice
        default: ""
        options: ["", "discovery", "evaluation", "branded", "risk"]

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run citation report
        id: run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_RECIPIENTS: ${{ secrets.REPORT_RECIPIENTS }}
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "schedule" ] || \
             [ "${{ inputs.send_email }}" = "true" ]; then
            ARGS="$ARGS --email"
          fi
          if [ -n "${{ inputs.stage }}" ]; then
            ARGS="$ARGS --stage ${{ inputs.stage }}"
          fi
          python -m src.run $ARGS

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Elyse Buckhead — Citation Report"
            echo ""
            echo "- Visibility score: **${{ steps.run.outputs.visibility }}**"
            echo "- Presence rate: ${{ steps.run.outputs.presence }}%"
            echo ""
            echo "Full report is attached as a build artifact below."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: citation-report-${{ github.run_number }}
          path: |
            reports/
            data/raw-*.json
          retention-days: 90
